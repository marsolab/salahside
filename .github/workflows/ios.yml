name: iOS

on:
  pull_request:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        working-directory: ios/PrayerFocus
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Check native formatting
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format PrayerFocusApp Shared PrayerFocusWidgets PrayerFocusMonitor PrayerFocusShield PrayerFocusShieldAction PrayerFocusTests PrayerFocusUITests TestSupport
      - name: Validate calculation reference fixtures
        run: swift test --package-path Vendor/Adhan
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate native Vision image comparison
        run: >-
          xcodebuild -project PrayerFocus.xcodeproj -scheme PrayerFocusVision
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO test
      - name: Select installed iPhone simulator
        id: simulator
        run: echo "id=$(python3 scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Run local schedule, focus and widget tests
        run: >-
          xcodebuild -project PrayerFocus.xcodeproj -scheme PrayerFocus
          -testPlan PrayerFocusWidgets -only-testing:PrayerFocusTests
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO test
      - name: Run setup, three-day trial and paywall tests
        run: >-
          xcodebuild -project PrayerFocus.xcodeproj -scheme PrayerFocus
          -testPlan PrayerFocus
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO test
      - name: Run widget StoreKit and deep-link integration tests
        run: >-
          xcodebuild -project PrayerFocus.xcodeproj -scheme PrayerFocus
          -testPlan PrayerFocusStoreKit
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO test
      - name: Build unsigned Release archive
        run: >-
          xcodebuild -project PrayerFocus.xcodeproj -scheme PrayerFocus
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/SalahSide.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Inspect release bundle
        run: python3 scripts/release_preflight.py build/SalahSide.xcarchive/Products/Applications/PrayerFocus.app --structural-only
