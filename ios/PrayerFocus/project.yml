name: PrayerFocus

options:
  bundleIdPrefix: com.marsolab
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

packages:
  Adhan:
    path: Vendor/Adhan

fileGroups:
  - Configuration
  - PrayerFocus.xctestplan
  - PrayerFocusWidgets.xctestplan
  - PrayerFocusStoreKit.xctestplan

targets:
  PrayerFocus:
    type: application
    platform: iOS
    sources:
      - path: PrayerFocusApp
      - path: Shared
    dependencies:
      - package: Adhan
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - target: PrayerFocusMonitor
        embed: true
      - target: PrayerFocusShield
        embed: true
      - target: PrayerFocusShieldAction
        embed: true
      - target: PrayerFocusWidgets
        embed: true
    entitlements:
      path: PrayerFocusApp/PrayerFocus.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.marsolab.PrayerFocus
    info:
      path: PrayerFocusApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo to register your prayer mat or compare it on this iPhone for an optional unlock.
        SalahSidePrivacyPolicyURL: $(SALAH_SIDE_PRIVACY_POLICY_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.marsolab.PrayerFocus.affirmations
            CFBundleURLSchemes:
              - prayerfocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SalahSide
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1

  PrayerFocusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerFocusWidgets
      - path: Shared/Affirmations
      - path: Shared/PrivacyInfo.xcprivacy
      - path: PrayerFocusApp/Design/PrayerTheme.swift
    entitlements:
      path: PrayerFocusWidgets/PrayerFocusWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marsolab.PrayerFocus
    info:
      path: PrayerFocusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Daily affirmations
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocus.Widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1

  PrayerFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - PrayerFocusMonitor
      - Shared/Focus
      - Shared/Affirmations/WidgetMembership.swift
      - Shared/PrivacyInfo.xcprivacy
      - PrayerFocusApp/Domain/Prayer.swift
      - PrayerFocusApp/Domain/PrayerSchedule.swift
    dependencies:
      - package: Adhan
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    entitlements:
      path: PrayerFocusMonitor/PrayerFocusMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.marsolab.PrayerFocus
    info:
      path: PrayerFocusMonitor/Info.plist
      properties:
        CFBundleDisplayName: SalahSide Focus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerFocusMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocus.Monitor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1

  PrayerFocusShield:
    type: app-extension
    platform: iOS
    sources:
      - PrayerFocusShield
      - Shared/PrivacyInfo.xcprivacy
      - Shared/Focus/FocusState.swift
      - Shared/Focus/FocusStateStore.swift
      - Shared/Focus/FocusPolicy.swift
      - Shared/Affirmations/WidgetMembership.swift
      - PrayerFocusApp/Domain/Prayer.swift
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    entitlements:
      path: PrayerFocusShield/PrayerFocusShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.marsolab.PrayerFocus
    info:
      path: PrayerFocusShield/Info.plist
      properties:
        CFBundleDisplayName: SalahSide Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerFocusShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocus.Shield
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1

  PrayerFocusShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - PrayerFocusShieldAction
    dependencies:
      - sdk: ManagedSettings.framework
    entitlements:
      path: PrayerFocusShieldAction/PrayerFocusShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: PrayerFocusShieldAction/Info.plist
      properties:
        CFBundleDisplayName: SalahSide Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerFocusShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocus.ShieldAction
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1

  PrayerFocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrayerFocusTests
      - path: Configuration/PrayerFocus.storekit
        buildPhase: resources
      - path: Configuration/PrayerFocusWidgetsTesting.storekit
        buildPhase: resources
    dependencies:
      - target: PrayerFocus
    hostApplication: PrayerFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocusTests
        GENERATE_INFOPLIST_FILE: YES

  PrayerFocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PrayerFocusUITests
      - path: Configuration/PrayerFocus.storekit
        buildPhase: resources
      - path: Configuration/PrayerFocusWidgetsTesting.storekit
        buildPhase: resources
    dependencies:
      - target: PrayerFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsolab.PrayerFocusUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PrayerFocus
        TARGETED_DEVICE_FAMILY: 1

schemes:
  PrayerFocus:
    run:
      storeKitConfiguration: Configuration/PrayerFocus.storekit
    build:
      targets:
        PrayerFocus: all
        PrayerFocusWidgets: all
        PrayerFocusTests: [test]
        PrayerFocusUITests: [test]
    test:
      testPlans:
        - path: PrayerFocusWidgets.xctestplan
          defaultPlan: true
        - path: PrayerFocusStoreKit.xctestplan
        - path: PrayerFocus.xctestplan
      targets:
        - PrayerFocusTests
        - PrayerFocusUITests
